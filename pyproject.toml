[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xortify"
version = "0.1.0"
description = "A local-first desktop file organizer and cleanup assistant for Windows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vision = ["numpy>=1.26", "onnxruntime>=1.19", "Pillow>=10"]
build = ["pyinstaller>=6.22"]

[project.scripts]
xortify = "xortify.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xortify = ["assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
